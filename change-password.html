<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更改密碼</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">
      <img src="logo_blue.png" alt="Logo" class="navbar-logo">
      新南向磨課師 KPI 填報系統
    </div>
    <div class="navbar-user">
      <span id="navSchoolName"></span>
      <a href="form.html" class="nav-link" id="navFormLink">填寫表單</a>
      <button class="btn btn-sm btn-outline" onclick="Auth.logout()">登出</button>
    </div>
  </nav>

  <main class="container container-sm">
    <div class="page-header">
      <h2>更改密碼</h2>
    </div>

    <div class="card">
      <form id="changePasswordForm" novalidate>

        <div class="form-group">
          <label for="oldPassword">目前密碼</label>
          <input type="password" id="oldPassword" placeholder="請輸入目前密碼" required>
        </div>

        <div class="form-group">
          <label for="newPassword">新密碼</label>
          <input type="password" id="newPassword" placeholder="請輸入新密碼（至少 6 字元）"
                 minlength="6" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">確認新密碼</label>
          <input type="password" id="confirmPassword" placeholder="請再次輸入新密碼" required>
        </div>

        <div id="cpError"   class="alert alert-error  hidden"></div>
        <div id="cpSuccess" class="alert alert-success hidden"></div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="cpBtn">確認更改</button>
          <a id="backLink" href="form.html" class="btn btn-outline">返回</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async function() {
      const user = Auth.requireLogin();
      if (!user) return;

      document.getElementById('navSchoolName').textContent = user.school_name;

      // 管理者返回 admin 頁
      if (user.role === 'admin') {
        document.getElementById('navFormLink').href = 'admin.html';
        document.getElementById('navFormLink').textContent = '管理者儀表板';
        document.getElementById('backLink').href = 'admin.html';
      }

      document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const oldPw  = document.getElementById('oldPassword').value;
        const newPw  = document.getElementById('newPassword').value;
        const confPw = document.getElementById('confirmPassword').value;
        const errEl  = document.getElementById('cpError');
        const sucEl  = document.getElementById('cpSuccess');
        const btn    = document.getElementById('cpBtn');

        errEl.classList.add('hidden');
        sucEl.classList.add('hidden');

        if (newPw.length < 6) {
          errEl.textContent = '新密碼至少需要 6 個字元';
          errEl.classList.remove('hidden');
          return;
        }
        if (newPw !== confPw) {
          errEl.textContent = '兩次輸入的新密碼不一致';
          errEl.classList.remove('hidden');
          return;
        }

        btn.disabled    = true;
        btn.textContent = '更新中…';

        const oldHash = await Auth.sha256(oldPw);
        const newHash = await Auth.sha256(newPw);
        const result  = await API.changePassword(user.username, oldHash, newHash);

        btn.disabled    = false;
        btn.textContent = '確認更改';

        if (result.success) {
          sucEl.textContent = '✓ 密碼已成功更新，請重新登入。';
          sucEl.classList.remove('hidden');
          setTimeout(() => Auth.logout(), 2000);
        } else {
          errEl.textContent = result.message || '更改失敗，請稍後再試';
          errEl.classList.remove('hidden');
        }
      });
    })();
  </script>
</body>
</html>
