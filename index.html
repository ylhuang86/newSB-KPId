<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI 填報系統 — 登入</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-login">

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">📊</div>
      <h1>新南向磨課師 KPI 填報系統</h1>
      <p>請使用您的學校帳號登入</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">帳號</label>
        <input type="text" id="username" name="username"
               placeholder="請輸入帳號" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password">密碼</label>
        <input type="password" id="password" name="password"
               placeholder="請輸入密碼" autocomplete="current-password" required>
      </div>

      <div id="loginError" class="alert alert-error hidden"></div>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
        登入
      </button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // 已登入則直接跳轉
    (function() {
      const user = Auth.getSession();
      if (user) {
        window.location.href = user.role === 'admin' ? 'admin.html' : 'form.html';
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl  = document.getElementById('loginError');
      const btn      = document.getElementById('loginBtn');

      if (!username || !password) {
        errorEl.textContent = '請輸入帳號與密碼';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled    = true;
      btn.textContent = '登入中…';
      errorEl.classList.add('hidden');

      const result = await Auth.login(username, password);

      if (result.success) {
        window.location.href = result.role === 'admin' ? 'admin.html' : 'form.html';
      } else {
        errorEl.textContent = result.message || '登入失敗，請稍後再試';
        errorEl.classList.remove('hidden');
        btn.disabled    = false;
        btn.textContent = '登入';
      }
    });
  </script>
</body>
</html>
